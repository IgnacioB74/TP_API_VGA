# =====================================================================
# CI/CD: compila la API, despliega la infraestructura en Azure (Bicep)
# y publica la API en la Web App.
#
# Secrets requeridos (ver infra/README.md):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_RESOURCE_GROUP, SQL_ADMIN_PASSWORD, JWT_KEY
# =====================================================================
name: CI/CD - Infraestructura y API en Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write   # login a Azure por OIDC (sin contraseñas)
  contents: read

jobs:
  build:
    name: Build y publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TP_API_VGA.sln

      - name: Build
        run: dotnet build TP_API_VGA.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TP_API_VGA/Presentation.csproj -c Release -o ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  deploy:
    name: Deploy a Azure
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Login a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infraestructura (App Service + SQL + Key Vault)
        id: infra
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          # Opcional: variable de repo AZURE_LOCATION para usar otra región
          # (por defecto, la del resource group)
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          extra=()
          if [ -n "$AZURE_LOCATION" ]; then extra+=(location="$AZURE_LOCATION"); fi
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "vga-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters sqlAdminPassword="$SQL_ADMIN_PASSWORD" jwtKey="$JWT_KEY" "${extra[@]}" \
            --query properties.outputs -o json > outputs.json
          echo "webAppName=$(jq -r .webAppName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "webAppUrl=$(jq -r .webAppUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Deploy API a la Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webAppName }}
          package: ./publish

      - name: Smoke test
        run: |
          url="${{ steps.infra.outputs.webAppUrl }}/swagger/v1/swagger.json"
          echo "Probando $url"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            echo "Intento $i: HTTP $code"
            [ "$code" = "200" ] && echo "API online: ${{ steps.infra.outputs.webAppUrl }}" && exit 0
            sleep 15
          done
          echo "La API no respondió 200" && exit 1
